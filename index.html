<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a18">
<meta name="description" content="A clean, distraction-free markdown editor with easy chapter copying from contents mode">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon_180x180.png">
<title>Folio — Markdown Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" integrity="sha384-zZBvnvBsPsD4XQGBQMHifBGQllAlnvIMnQpLzsUVV5ZMGB3RDCkzX2z2F46WwqBE" crossorigin="anonymous">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #1a1a18;
  --surface:    #232320;
  --surface2:   #2c2c28;
  --border:     #3a3a35;
  --accent:     #c9a84c;
  --accent2:    #e8c96a;
  --text:       #e8e4d8;
  --muted:      #7a776e;
  --danger:     #c0604a;
  --preview-bg: #1e1e1b;
  --mono:       'JetBrains Mono', monospace;
  --serif:      'Lora', Georgia, serif;
  --display:    'Playfair Display', Georgia, serif;
  --radius:     8px;
  --tr:         180ms cubic-bezier(.4,0,.2,1);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
}

html { height: 100%; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  overscroll-behavior: none;
}

/* TOPBAR */
#topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  padding-top: var(--safe-top);
  height: calc(52px + var(--safe-top));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 20;
  position: relative;
}
#logo {
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  color: var(--accent);
  letter-spacing: .04em;
  flex-shrink: 0;
  margin-right: 2px;
}
#filename-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  overflow: hidden;
}
#filename-display {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
#filename-display .name { color: var(--text); }
#filename-display .dot  { color: var(--accent); opacity: .7; margin: 0 2px; }
#dirty-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  opacity: 0;
  transition: opacity var(--tr);
}
#dirty-dot.visible { opacity: 1; }

.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px;
  border-radius: var(--radius);
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all var(--tr);
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.icon-btn:active { background: var(--surface2); color: var(--text); }

#btn-save {
  padding: 0 14px;
  width: auto;
  background: var(--accent);
  color: var(--bg);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  border-radius: 20px;
  height: 34px;
  gap: 5px;
  display: flex; align-items: center;
}
#btn-save:active { background: var(--accent2); color: var(--bg); }

/* TAB BAR */
#tab-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 0;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--tr);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  position: relative;
}
.tab-btn.active { color: var(--accent); }
.tab-btn::after {
  content: '';
  position: absolute;
  bottom: 0; left: 20%; right: 20%;
  height: 2px;
  background: var(--accent);
  border-radius: 2px 2px 0 0;
  transform: scaleX(0);
  transition: transform var(--tr);
}
.tab-btn.active::after { transform: scaleX(1); }

/* MAIN */
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* PANES — mobile: full screen, sliding */
.pane {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  transition: transform 220ms cubic-bezier(.4,0,.2,1), opacity 220ms cubic-bezier(.4,0,.2,1);
  will-change: transform;
}
#toc-pane     { transform: translateX(-100%); opacity: 0; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
#editor-pane  { transform: translateX(0);    opacity: 1; }
#preview-pane { transform: translateX(100%); opacity: 0; background: var(--preview-bg); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

body.view-contents #toc-pane     { transform: translateX(0);      opacity: 1; pointer-events: all; }
body.view-contents #editor-pane  { transform: translateX(100%);   opacity: 0; pointer-events: none; }
body.view-preview  #editor-pane  { transform: translateX(-100%);  opacity: 0; pointer-events: none; }
body.view-preview  #preview-pane { transform: translateX(0);       opacity: 1; pointer-events: all; }

/* DESKTOP: side by side */
@media (min-width: 768px) {
  #tab-bar    { display: none; }
  #bottom-nav { display: none !important; }
  #statusbar  { display: flex !important; }
  #desktop-view-toggle { display: flex !important; }

  #main { overflow: hidden; }
  .pane {
    position: relative;
    inset: auto;
    flex: 1;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: all !important;
  }
  #editor-pane { border-right: 1px solid var(--border); }
  body.view-editor   #preview-pane { display: none; }
  body.view-editor   #toc-pane     { display: none; }
  body.view-preview  #editor-pane  { display: none; }
  body.view-preview  #toc-pane     { display: none; }
  body.view-contents #editor-pane  { display: none; }
  body.view-contents #preview-pane { display: none; }
  body.view-split #toc-pane        { display: none; }
  body.view-split #editor-pane,
  body.view-split #preview-pane {
    display: flex;
    flex: 0 0 50%;
    max-width: 50%;
    min-width: 0;
  }
  body.view-split #preview-content {
    max-width: none;
    width: 100%;
    margin: 0;
  }
}

/* EDITOR */
#editor {
  flex: 1;
  resize: none;
  background: var(--bg);
  color: var(--text);
  border: none;
  outline: none;
  font-family: var(--mono);
  font-size: 16px; /* 16px prevents iOS zoom on focus */
  line-height: 1.85;
  padding: 20px 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  tab-size: 2;
  caret-color: var(--accent);
  white-space: pre-wrap;
  word-break: break-word;
}
#editor::selection { background: rgba(201,168,76,.25); }
#editor::placeholder { color: var(--muted); }
@media (min-width: 768px) {
  #editor { padding: 32px 40px; font-size: 14px; }
}

/* MARKDOWN TOOLBAR */
#md-toolbar {
  display: flex;
  align-items: center;
  gap: 1px;
  padding: 3px 4px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  flex-shrink: 0;
  -webkit-user-select: none;
  user-select: none;
}
#md-toolbar::-webkit-scrollbar { display: none; }
.md-btn {
  display: flex; align-items: center; justify-content: center;
  min-width: 42px; height: 42px;
  padding: 0 5px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--tr), color var(--tr), transform 80ms;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.md-btn:active { background: var(--surface2); color: var(--accent); transform: scale(.9); }
.md-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
@media (min-width: 768px) { #md-toolbar { display: none; } }

/* PREVIEW */
#preview-content {
  max-width: 700px;
  width: 100%;
  min-width: 0;
  margin: 0 auto;
  padding: 24px 18px calc(24px + var(--safe-bottom));
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.8;
  color: var(--text);
  overflow-wrap: anywhere;
  word-break: break-word;
}
@media (min-width: 768px) {
  #preview-content { padding: 40px; font-size: 15.5px; }
}
#preview-content h1,#preview-content h2,#preview-content h3,
#preview-content h4,#preview-content h5,#preview-content h6 {
  font-family: var(--display); font-weight: 600; line-height: 1.25;
  margin: 1.5em 0 .5em; color: #f0ead8;
}
#preview-content h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
#preview-content h2 { font-size: 1.4em; }
#preview-content h3 { font-size: 1.15em; }
#preview-content h4 { font-size: 1em; color: var(--accent); }
#preview-content p  { margin: .85em 0; }
#preview-content a  { color: var(--accent2); text-decoration: underline; text-underline-offset: 3px; }
#preview-content strong { color: #f0ead8; font-weight: 600; }
#preview-content em { font-style: italic; color: #d8d0c0; }
#preview-content blockquote {
  border-left: 3px solid var(--accent); margin: 1.1em 0;
  padding: .4em 1em; color: var(--muted); font-style: italic;
}
#preview-content code {
  font-family: var(--mono); font-size: .85em;
  background: var(--surface2); border: 1px solid var(--border);
  padding: .12em .38em; border-radius: 4px; color: var(--accent2);
}
#preview-content pre {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius); padding: 1em 1.2em; overflow-x: auto; margin: 0;
}
#preview-content pre code { background: none; border: none; padding: 0; font-size: .87em; color: var(--text); }
#preview-content .code-block-wrap { margin: 1.1em 0; }
#preview-content .code-block-header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface2); border: 1px solid var(--border); border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0;
  padding: .3em .7em; font-family: var(--mono); font-size: .75em; color: var(--muted);
}
.code-copy-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 4px; padding: .15em .5em; font-family: var(--mono); font-size: .75em;
  cursor: pointer; transition: color var(--tr), border-color var(--tr);
}
.code-copy-btn:hover, .code-copy-btn.copied { color: var(--accent); border-color: var(--accent); }
#preview-content ul,#preview-content ol { padding-left: 1.5em; margin: .7em 0; }
#preview-content li { margin: .25em 0; }
#preview-content li::marker { color: var(--accent); }
#preview-content li.task-item { list-style: none; margin-left: -1.2em; }
#preview-content input.task-checkbox { cursor: pointer; accent-color: var(--accent); width: .9em; height: .9em; vertical-align: middle; margin-right: .4em; margin-top: -.1em; }
#preview-content hr { border: none; border-top: 1px solid var(--border); margin: 1.8em 0; }
#preview-content table { width: 100%; border-collapse: collapse; margin: 1.1em 0; font-size: .9em; }
#preview-content th { background: var(--surface); color: var(--accent); font-family: var(--mono); font-size: .82em; text-align: left; padding: .5em .8em; border: 1px solid var(--border); }
#preview-content td { padding: .45em .8em; border: 1px solid var(--border); }
#preview-content tr:nth-child(even) td { background: rgba(255,255,255,.02); }
#preview-content img { max-width: 100%; border-radius: var(--radius); margin: .8em 0; }

/* BOTTOM NAV */
#bottom-nav {
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
  flex-shrink: 0;
  z-index: 20;
}
.nav-btn {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  padding: 10px 4px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  transition: all var(--tr);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 56px;
}
.nav-btn:active { color: var(--accent); background: var(--surface2); }

/* STATUS BAR */
#statusbar {
  display: none;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  height: 28px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
#statusbar .accent { color: var(--accent); }

/* DESKTOP VIEW TOGGLE */
#desktop-view-toggle {
  display: none;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  flex-shrink: 0;
}
.dvt-btn {
  padding: 5px 10px; height: 32px;
  border: none; background: transparent;
  color: var(--muted); font-family: var(--mono); font-size: 11px;
  cursor: pointer; transition: all var(--tr);
  display: flex; align-items: center; gap: 5px;
}
.dvt-btn.active { background: var(--surface2); color: var(--accent); }
.dvt-btn:hover:not(.active) { color: var(--text); }

/* TOC PANE */
#toc-content {
  max-width: 700px;
  margin: 0 auto;
  padding: 24px 18px calc(24px + var(--safe-bottom));
}
.toc-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-bottom: 12px;
}
.toc-empty {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 13px;
  font-style: italic;
  margin-top: 16px;
}
.toc-row {
  display: flex;
  align-items: flex-start;
  border-radius: 6px;
  transition: background var(--tr);
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
  margin-bottom: 2px;
}
.toc-row:active { background: var(--surface2); }
.toc-jump {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 8px 9px 0;
  border: none;
  background: transparent;
  color: var(--text);
  text-align: left;
  font-family: var(--serif);
  font-size: 15px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-width: 0;
  overflow: hidden;
}
.toc-jump-text {
  white-space: normal;
  word-break: break-word;
}
.toc-row[data-depth="1"] .toc-jump { font-weight: 600; color: var(--text); }
.toc-row[data-depth="2"] .toc-jump { padding-left: 16px; color: var(--text); }
.toc-row[data-depth="3"] .toc-jump { padding-left: 32px; color: var(--muted); font-size: 14px; }
.toc-row[data-depth="4"] .toc-jump { padding-left: 48px; color: var(--muted); font-size: 13px; }
.toc-row[data-depth="5"] .toc-jump { padding-left: 60px; color: var(--muted); font-size: 12px; }
.toc-row[data-depth="6"] .toc-jump { padding-left: 72px; color: var(--muted); font-size: 12px; }
.toc-copy {
  flex-shrink: 0;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: color var(--tr), background var(--tr);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.toc-copy:active, .toc-copy.copied { color: var(--accent); background: var(--surface2); }
@media (min-width: 768px) {
  #toc-content { padding: 40px; }
}

/* EMPTY STATE */
#empty-state {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
  background: var(--bg);
  z-index: 5;
  transition: opacity .25s;
  padding: 32px 24px;
  text-align: center;
}
#empty-state.hidden { opacity: 0; pointer-events: none; }
.es-logo { font-family: var(--display); font-size: 36px; font-weight: 600; color: var(--accent); letter-spacing: .05em; }
.es-tagline { color: var(--muted); font-size: 14px; font-style: italic; margin-bottom: 8px; }
.es-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
.es-action-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 15px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--mono); font-size: 13px;
  cursor: pointer; transition: all var(--tr);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.es-action-btn:active { border-color: var(--accent); color: var(--accent); background: var(--surface2); }
.es-action-btn svg { color: var(--accent); flex-shrink: 0; }

/* TOAST */
#toast {
  position: fixed;
  bottom: calc(72px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 12px;
  padding: 9px 18px; border-radius: 20px;
  pointer-events: none; opacity: 0;
  transition: all .25s; z-index: 200; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--accent); color: var(--accent2); }
#toast.error   { border-color: var(--danger); color: var(--danger); }
@media (min-width: 768px) { #toast { bottom: 40px; } }

/* CONFIRM DIALOG */
#confirm-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 60; opacity: 0; pointer-events: none;
  transition: opacity .2s;
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
#confirm-overlay.open { opacity: 1; pointer-events: all; }
#confirm-dialog {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -48%) scale(.96);
  width: min(320px, calc(100vw - 40px));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px 20px 16px;
  z-index: 61;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s cubic-bezier(.4,0,.2,1);
}
#confirm-dialog.open {
  opacity: 1; pointer-events: all;
  transform: translate(-50%, -50%) scale(1);
}
.cd-title {
  font-family: var(--display); font-size: 17px; font-weight: 600;
  color: var(--text); margin-bottom: 8px;
}
.cd-msg {
  font-family: var(--serif); font-size: 14px; color: var(--muted);
  line-height: 1.5; margin-bottom: 20px;
}
.cd-actions { display: flex; gap: 10px; justify-content: flex-end; }
.cd-btn {
  padding: 9px 18px;
  border: none; border-radius: 8px;
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--tr);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.cd-btn-cancel { background: var(--surface2); color: var(--muted); }
.cd-btn-cancel:active { color: var(--text); }
.cd-btn-discard { background: var(--danger); color: #fff; }
.cd-btn-discard:active { opacity: .85; }

/* BOTTOM SHEET */
#sheet-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 40; opacity: 0; pointer-events: none;
  transition: opacity .25s;
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}
#sheet-overlay.open { opacity: 1; pointer-events: all; }
#bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  border-top: 1px solid var(--border);
  padding: 12px 0 calc(16px + var(--safe-bottom));
  z-index: 50;
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
#bottom-sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 0 auto 14px;
}
.sheet-title {
  font-family: var(--mono); font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .1em;
  padding: 0 20px 8px;
}
.sheet-item {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 20px;
  color: var(--text); font-family: var(--serif); font-size: 16px;
  cursor: pointer; transition: background var(--tr);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  border: none; background: none; width: 100%; text-align: left;
}
.sheet-item:active { background: var(--surface2); }
.sheet-item svg { color: var(--accent); flex-shrink: 0; }
.sheet-item .item-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }
.sheet-info {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px;
  color: var(--muted); font-family: var(--mono); font-size: 12px;
}
.sheet-info svg { color: var(--muted); flex-shrink: 0; }
.sheet-sep { height: 1px; background: var(--border); margin: 6px 0; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-Rp3zDb+pEKMdYa2E5V6xwTVmV2gmnAsQfPWJF9tRl68m9p/WNPtNBGw2jS6jTAph" crossorigin="anonymous"></script>
<script>
const APP_VERSION = 'v1.4.0';

function parseMarkdown(src) {
  const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => s
    .replace(/`([^`]+)`/g, (_,c) => '<code>'+escape(c)+'</code>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/__(.+?)__/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/_([^_\n]+)_/g,'<em>$1</em>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const minInd=arr=>{let m=Infinity;arr.forEach(l=>{const t=typeof l==='string'?l:l.text;const r=t.match(/^( *)/);if(r)m=Math.min(m,r[1].length);});return m===Infinity?0:m;};
  const parseBlock=(arr,base)=>{
    let out='',j=0,ctag=null;
    while(j<arr.length){
      const lx=typeof arr[j]==='string'?arr[j]:arr[j].text;
      const srcLine=typeof arr[j]==='string'?null:arr[j].lineIdx;
      const mx=lx.match(/^( *)([-*+]|\d+\.)\s+(.*)/);
      if(!mx){j++;continue;}
      const ind=mx[1].length;
      if(ind<base)break;
      if(ind>base){j++;continue;}
      const isOl=/^\d+\./.test(mx[2]);
      const t=isOl?'ol':'ul';
      if(t!==ctag){if(ctag)out+='</'+ctag+'>';out+='<'+t+'>';ctag=t;}
      const subArr=[];j++;
      while(j<arr.length){const sx=typeof arr[j]==='string'?arr[j]:arr[j].text;const sm=sx.match(/^( *)([-*+]|\d+\.)\s/);if(!sm||sm[1].length<=base)break;subArr.push(arr[j]);j++;}
      let content=mx[3]; let liClass=''; let cbHtml='';
      const cbm=content.match(/^\[([ xX])\]\s+(.*)/);
      if(cbm&&srcLine!==null){
        const checked=cbm[1].toLowerCase()==='x';
        cbHtml='<input type="checkbox" class="task-checkbox" data-line="'+srcLine+'"'+(checked?' checked':'')+'>';
        content=cbm[2]; liClass=' class="task-item"';
      }
      out+='<li'+liClass+'>'+cbHtml+inline(content);
      if(subArr.length)out+=parseBlock(subArr,minInd(subArr));
      out+='</li>';
    }
    if(ctag)out+='</'+ctag+'>';
    return out;
  };
  const lines=src.split('\n'); let html='',i=0;
  while(i<lines.length){
    const line=lines[i]; const sl=i;
    if(/^```/.test(line)){
      const lang=line.slice(3).trim(); let code=''; i++;
      while(i<lines.length&&!/^```/.test(lines[i])){code+=escape(lines[i])+'\n';i++;}
      html+='<pre data-source-line="'+sl+'"><code'+(lang?' class="lang-'+lang+'"':'')+'>'+code+'</code></pre>'; i++; continue;
    }
    const hm=line.match(/^(#{1,6})\s+(.*)/);
    if(hm){html+='<h'+hm[1].length+' data-source-line="'+sl+'">'+inline(hm[2])+'</h'+hm[1].length+'>'; i++; continue;}
    if(/^[-*_]{3,}\s*$/.test(line)){html+='<hr data-source-line="'+sl+'">'; i++; continue;}
    if(/^>\s?/.test(line)){
      let bq='';
      while(i<lines.length&&/^>\s?/.test(lines[i])){bq+=lines[i].replace(/^>\s?/,'')+'\n';i++;}
      html+='<blockquote data-source-line="'+sl+'">'+parseMarkdown(bq.trim())+'</blockquote>'; continue;
    }
    if(/^[ \t]*([-*+]|\d+\.)\s/.test(line)){
      const listLines=[];
      while(i<lines.length&&/^[ \t]*([-*+]|\d+\.)\s/.test(lines[i])){listLines.push({text:lines[i],lineIdx:i});i++;}
      const listHtml=parseBlock(listLines,minInd(listLines));
      html+=listHtml.replace(/^<(ul|ol)>/,'<$1 data-source-line="'+sl+'">'); continue;
    }
    if(/\|/.test(line)&&i+1<lines.length&&/^\|?[-:| ]+\|/.test(lines[i+1])){
      const rh=line.replace(/^\|/,'').replace(/\|$/,'').split('|').map(h=>h.trim());
      i+=2; html+='<table data-source-line="'+sl+'"><thead><tr>';
      rh.forEach(h=>html+='<th>'+inline(h)+'</th>');
      html+='</tr></thead><tbody>';
      while(i<lines.length&&/\|/.test(lines[i])&&lines[i].trim()){
        const cols=lines[i].replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
        html+='<tr>'; cols.forEach(c=>html+='<td>'+inline(c)+'</td>'); html+='</tr>'; i++;
      }
      html+='</tbody></table>'; continue;
    }
    if(!line.trim()){i++; continue;}
    let para='';
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|>|[ \t]*([-*+]|\d+\.)\s|```|[-*_]{3,}\s*$)/.test(lines[i])){
      para+=(para?' ':'')+lines[i].trim(); i++;
    }
    if(para) html+='<p data-source-line="'+sl+'">'+inline(para)+'</p>';
  }
  return html;
}

let fileHandle=null, isDirty=false, currentView='editor';

// --- Draft persistence (survive device memory clearing) ---
const DRAFT_KEY='folio_draft';
let _draftTimer;
function saveDraft(){
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify({
      content:editor.value,
      filename:fnameText.textContent||'untitled',
      dirty:isDirty
    }));
  }catch(e){console.warn('Draft save failed:',e);}
}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){console.warn('Draft clear failed:',e);}}
function scheduleSaveDraft(){clearTimeout(_draftTimer);_draftTimer=setTimeout(saveDraft,500);}
function restoreDraft(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(!d||typeof d.content!=='string'||!d.content)return;
    editor.value=d.content;
    setFilename(d.filename||'untitled');
    setDirty(!!d.dirty);
    renderPreview(); updateStats(); showContent();
    showToast('Draft restored','success');
  }catch(e){console.warn('Draft restore failed:',e);}
}
// ---

const editor=document.getElementById('editor'),
      preview=document.getElementById('preview-content'),
      dirtyDot=document.getElementById('dirty-dot'),
      emptyState=document.getElementById('empty-state'),
      toast=document.getElementById('toast'),
      fileInput=document.getElementById('file-input'),
      fnameText=document.getElementById('fname-text'),
      statWords=document.getElementById('stat-words'),
      statChars=document.getElementById('stat-chars'),
      statLines=document.getElementById('stat-lines'),
      statCursor=document.getElementById('stat-cursor'),
      statSaved=document.getElementById('stat-saved'),
      navWC=document.getElementById('nav-word-count'),
      sheetStats=document.getElementById('sheet-stats-text'),
      overlay=document.getElementById('sheet-overlay'),
      sheet=document.getElementById('bottom-sheet'),
      confirmOverlay=document.getElementById('confirm-overlay'),
      confirmDialog=document.getElementById('confirm-dialog');

document.getElementById('sheet-version-text').textContent = APP_VERSION;

function showToast(msg,type='',dur=2200){
  toast.textContent=msg; toast.className='show '+(type||'');
  clearTimeout(toast._t); toast._t=setTimeout(()=>{toast.className='';},dur);
}
function setDirty(v){isDirty=v; dirtyDot.classList.toggle('visible',v);}
function setFilename(n){fnameText.textContent=n||'untitled';}
function updateStats(){
  const v=editor.value;
  const w=v.trim()?v.trim().split(/\s+/).length:0;
  const c=v.length, l=v?v.split('\n').length:0;
  if(statWords)statWords.textContent=w;
  if(statChars)statChars.textContent=c;
  if(statLines)statLines.textContent=l;
  if(navWC)navWC.textContent=w+'w';
  if(sheetStats)sheetStats.textContent=w+' words · '+c+' chars · '+l+' lines';
}
function updateCursor(){
  const b=editor.value.substring(0,editor.selectionStart).split('\n');
  if(statCursor)statCursor.textContent='Ln '+b.length+', Col '+(b[b.length-1].length+1);
}
function renderPreview(){
  preview.innerHTML=parseMarkdown(editor.value);
  preview.querySelectorAll('pre').forEach(pre=>{
    const code=pre.querySelector('code'); if(!code) return;
    const lang=(code.className.match(/lang-(\w+)/)||[])[1]||'';
    if(typeof hljs!=='undefined') hljs.highlightElement(code);
    const header=document.createElement('div'); header.className='code-block-header';
    const label=document.createElement('span'); label.textContent=lang||'plaintext';
    const copyBtn=document.createElement('button'); copyBtn.className='code-copy-btn'; copyBtn.textContent='Copy';
    copyBtn.addEventListener('click',()=>{
      navigator.clipboard.writeText(code.textContent).then(()=>{
        copyBtn.textContent='Copied!'; copyBtn.classList.add('copied');
        setTimeout(()=>{copyBtn.textContent='Copy'; copyBtn.classList.remove('copied');},1500);
      }).catch(()=>showToast('Copy failed','error'));
    });
    header.appendChild(label); header.appendChild(copyBtn);
    const wrap=document.createElement('div'); wrap.className='code-block-wrap';
    pre.parentNode.insertBefore(wrap,pre); wrap.appendChild(header); wrap.appendChild(pre);
  });
  preview.querySelectorAll('input.task-checkbox').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const lineIdx=parseInt(cb.dataset.line);
      const lines=editor.value.split('\n');
      if(cb.checked){
        lines[lineIdx]=lines[lineIdx].replace(/^(\s*(?:[-*+]|\d+\.)\s+)\[ \]/,'$1[x]');
      } else {
        lines[lineIdx]=lines[lineIdx].replace(/^(\s*(?:[-*+]|\d+\.)\s+)\[[xX]\]/,'$1[ ]');
      }
      editor.value=lines.join('\n');
      setDirty(true); scheduleSaveDraft(); updateStats(); renderPreview();
    });
  });
}
function showContent(){emptyState.classList.add('hidden');}

function renderToc(){
  const lines=editor.value.split('\n');
  const headings=[];
  lines.forEach((line,idx)=>{
    const m=line.match(/^(#{1,6})\s+(.*)/);
    if(m) headings.push({depth:m[1].length,text:m[2],lineIndex:idx});
  });
  const container=document.getElementById('toc-content');
  if(!headings.length){
    container.innerHTML='<div class="toc-label">Contents</div><div class="toc-empty">No headings found</div>';
    return;
  }
  let html='<div class="toc-label">Contents</div>';
  headings.forEach((h,i)=>{
    const escapedText=h.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    html+=`<div class="toc-row" data-depth="${h.depth}" data-line="${h.lineIndex}" data-heading-idx="${i}">
      <button class="toc-jump" data-line="${h.lineIndex}">
        <span>▸</span><span class="toc-jump-text">${escapedText}</span>
      </button>
      <button class="toc-copy" title="Copy section" data-heading-idx="${i}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>`;
  });
  container.innerHTML=html;
  container.querySelectorAll('.toc-jump').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lineIdx=parseInt(btn.dataset.line,10);
      const allLines=editor.value.split('\n');
      let charOffset=0;
      for(let i=0;i<lineIdx;i++) charOffset+=allLines[i].length+1;
      setView('editor');
      requestAnimationFrame(()=>{
        editor.focus();
        editor.setSelectionRange(charOffset,charOffset);
      });
    });
  });
  container.querySelectorAll('.toc-copy').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.headingIdx,10);
      const h=headings[idx];
      const allLines=editor.value.split('\n');
      let endLine=allLines.length;
      for(let i=h.lineIndex+1;i<allLines.length;i++){
        const m=allLines[i].match(/^(#{1,6})\s/);
        if(m&&m[1].length<=h.depth){endLine=i;break;}
      }
      const section=allLines.slice(h.lineIndex,endLine).join('\n');
      navigator.clipboard.writeText(section).then(()=>{
        btn.classList.add('copied');
        setTimeout(()=>btn.classList.remove('copied'),1500);
        showToast('Copied!','success');
      }).catch(()=>showToast('Copy failed','error'));
    });
  });
}

function setView(v){
  const prevView=currentView;

  // Capture scroll anchor BEFORE switching so source pane is still laid out
  let anchorLine=null;
  if(v==='preview'&&prevView==='editor'){
    const totalLines=editor.value.split('\n').length||1;
    const lh=editor.scrollHeight/totalLines;
    anchorLine=lh>0?Math.floor(editor.scrollTop/lh):0;
  } else if(v==='editor'&&prevView==='preview'){
    anchorLine=_getTopSourceLineFromPreview();
  }

  currentView=v;
  document.body.className='view-'+v;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.dvt-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  if(v!=='editor') renderPreview();
  if(v==='contents') renderToc();
  if(v==='split') requestAnimationFrame(_syncPreviewFromEditor);
  if(anchorLine!==null) requestAnimationFrame(()=>_scrollToSourceLine(v,anchorLine));
}

function openFile(){
  closeSheet();
  confirmDiscard(()=>_doOpenFile());
}
async function _doOpenFile(){
  if(window.showOpenFilePicker){
    try{
      const[h]=await window.showOpenFilePicker({types:[{description:'Markdown',accept:{'text/markdown':['.md','.markdown'],'text/plain':['.txt']}}]});
      fileHandle=h; const f=await h.getFile();
      editor.value=await f.text();
      setFilename(f.name.replace(/\.[^.]+$/,''));
      setDirty(false); renderPreview(); updateStats(); showContent();
      saveDraft();
      showToast('Opened','success');
    }catch(e){if(e.name!=='AbortError')showToast('Could not open','error');}
  } else { fileInput.click(); }
}

fileInput.addEventListener('change',async()=>{
  const f=fileInput.files[0]; if(!f) return;
  editor.value=await f.text();
  setFilename(f.name.replace(/\.[^.]+$/,''));
  fileHandle=null; setDirty(false); renderPreview(); updateStats(); showContent();
  showToast('Opened','success'); saveDraft(); fileInput.value='';
});

async function saveFile(){
  closeSheet();
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle){
        fileHandle=await window.showSaveFilePicker({
          suggestedName:(fnameText.textContent||'untitled')+'.md',
          types:[{description:'Markdown',accept:{'text/markdown':['.md']}}]
        });
        setFilename((fileHandle.name||'').replace(/\.[^.]+$/,''));
      }
      const w=await fileHandle.createWritable();
      await w.write(editor.value); await w.close();
      setDirty(false); clearDraft();
      const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      if(statSaved)statSaved.textContent='Saved '+t;
      showToast('Saved ✓','success');
    }catch(e){if(e.name!=='AbortError')fallbackSave();}
  } else { fallbackSave(); }
}

function fallbackSave(){
  const b=new Blob([editor.value],{type:'text/markdown'});
  const u=URL.createObjectURL(b);
  const a=Object.assign(document.createElement('a'),{href:u,download:(fnameText.textContent||'untitled')+'.md'});
  a.click(); URL.revokeObjectURL(u);
  setDirty(false); clearDraft(); showToast('Downloaded as .md','success');
}

function newFile(){
  closeSheet();
  confirmDiscard(()=>{
    editor.value=''; fileHandle=null;
    setFilename('untitled'); setDirty(false);
    renderPreview(); updateStats();
    emptyState.classList.remove('hidden');
    if(statSaved)statSaved.textContent='—';
    clearDraft(); setView('editor');
  });
}

function openSheet(){overlay.classList.add('open'); sheet.classList.add('open'); updateStats();}
function closeSheet(){overlay.classList.remove('open'); sheet.classList.remove('open');}

let _confirmCb=null;
function confirmDiscard(cb){
  if(isDirty&&editor.value.trim()){
    _confirmCb=cb;
    confirmOverlay.classList.add('open'); confirmDialog.classList.add('open');
  } else { cb(); }
}
document.getElementById('cd-discard').addEventListener('click',()=>{
  confirmOverlay.classList.remove('open'); confirmDialog.classList.remove('open');

// Swipe-down to close sheet
let sheetTouchY=0;
sheet.addEventListener('touchstart',e=>{sheetTouchY=e.touches[0].clientY;},{passive:true});
sheet.addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientY-sheetTouchY>60) closeSheet();
},{passive:true});

// MD toolbar
function wrapSel(before,after,def){
  const s=editor.selectionStart,e2=editor.selectionEnd;
  const sel=editor.value.slice(s,e2)||def||'';
  editor.value=editor.value.slice(0,s)+before+sel+after+editor.value.slice(e2);
  editor.selectionStart=s+before.length;
  editor.selectionEnd=s+before.length+sel.length;
  editor.focus(); setDirty(true); renderPreview(); updateStats(); scheduleSaveDraft();
}
function lineStart(prefix){
  const s=editor.selectionStart;
  const ls=editor.value.lastIndexOf('\n',s-1)+1;
  const le=editor.value.indexOf('\n',s); const e2=le===-1?editor.value.length:le;
  const line=editor.value.slice(ls,e2);
  if(line.startsWith(prefix)){
    editor.value=editor.value.slice(0,ls)+line.slice(prefix.length)+editor.value.slice(e2);
    editor.selectionStart=editor.selectionEnd=Math.max(ls,s-prefix.length);
  } else {
    editor.value=editor.value.slice(0,ls)+prefix+line+editor.value.slice(e2);
    editor.selectionStart=editor.selectionEnd=s+prefix.length;
  }
  editor.focus(); setDirty(true); renderPreview(); updateStats(); scheduleSaveDraft();
}

document.getElementById('md-toolbar').addEventListener('click',e=>{
  const btn=e.target.closest('.md-btn'); if(!btn) return;
  showContent();
  switch(btn.dataset.action){
    case 'h1': lineStart('# '); break;
    case 'h2': lineStart('## '); break;
    case 'h3': lineStart('### '); break;
    case 'bold': wrapSel('**','**','bold text'); break;
    case 'italic': wrapSel('*','*','italic text'); break;
    case 'strikethrough': wrapSel('~~','~~','text'); break;
    case 'code': wrapSel('`','`','code'); break;
    case 'ul': lineStart('- '); break;
    case 'ol': lineStart('1. ');
      {const rn=renumberOrderedLists(editor.value,editor.selectionStart);
      if(rn){editor.value=rn.val;editor.selectionStart=editor.selectionEnd=rn.cursorPos;renderPreview();}}
      break;
    case 'quote': lineStart('> '); break;
    case 'codeblock': wrapSel('```\n','\n```','code here'); break;
    case 'link': wrapSel('[','](url)','link text'); break;
    case 'hr':{
      const p=editor.selectionStart,ins='\n---\n';
      editor.value=editor.value.slice(0,p)+ins+editor.value.slice(p);
      editor.selectionStart=editor.selectionEnd=p+ins.length;
      editor.focus(); setDirty(true); renderPreview(); updateStats(); scheduleSaveDraft(); break;
    }
    case 'table':{
      const p=editor.selectionStart,tbl='\n| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| Cell     | Cell     | Cell     |\n';
      editor.value=editor.value.slice(0,p)+tbl+editor.value.slice(p);
      editor.selectionStart=editor.selectionEnd=p+tbl.length;
      editor.focus(); setDirty(true); renderPreview(); updateStats(); scheduleSaveDraft(); break;
    }
  }
});

function renumberOrderedLists(val,cursorPos){
  const lines=val.split('\n');
  const counters={};
  let changed=false,pos=0,newCursor=cursorPos;
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/^( *)(\d+)(\.\s+)/);
    if(m){
      const ind=m[1].length;
      Object.keys(counters).forEach(k=>{if(Number(k)>ind)delete counters[k];});
      counters[ind]=(counters[ind]||0)+1;
      const oldNum=m[2],newNum=String(counters[ind]);
      if(oldNum!==newNum){
        lines[i]=m[1]+newNum+m[3]+lines[i].slice(m[0].length);
        changed=true;
        if(pos<newCursor) newCursor+=newNum.length-oldNum.length;
      }
    }else{Object.keys(counters).forEach(k=>delete counters[k]);}
    pos+=lines[i].length+1;
  }
  return changed?{val:lines.join('\n'),cursorPos:Math.max(0,newCursor)}:null;
}

editor.addEventListener('input',()=>{
  const rn=renumberOrderedLists(editor.value,editor.selectionStart);
  if(rn){editor.value=rn.val;editor.selectionStart=editor.selectionEnd=rn.cursorPos;}
  showContent(); setDirty(true); renderPreview(); updateStats(); scheduleSaveDraft();
});
editor.addEventListener('beforeinput',e=>{
  if((e.inputType==='insertLineBreak'||e.inputType==='insertParagraph')&&editor.selectionStart===editor.selectionEnd){
    const s=editor.selectionStart;
    const val=editor.value;
    const ls=val.lastIndexOf('\n',s-1)+1;
    const le=val.indexOf('\n',s);
    const lineEnd=le===-1?val.length:le;
    const fullLine=val.slice(ls,lineEnd);
    const ulMatch=fullLine.match(/^(\s*[-*+]) /);
    const olMatch=fullLine.match(/^(\s*\d+\.)(\s+)/);
    if(ulMatch||olMatch){
      const prefix=ulMatch?ulMatch[0]:olMatch[0];
      if(s>=ls+prefix.length) e.preventDefault();
    }
  }
});
editor.addEventListener('keyup',updateCursor);
editor.addEventListener('click',updateCursor);
editor.addEventListener('focus',showContent);

editor.addEventListener('keydown',e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const s=editor.selectionStart,e2=editor.selectionEnd;
    editor.value=editor.value.slice(0,s)+'  '+editor.value.slice(e2);
    editor.selectionStart=editor.selectionEnd=s+2;
    setDirty(true); renderPreview(); scheduleSaveDraft();
  }
  if(e.key==='Enter'&&editor.selectionStart===editor.selectionEnd){
    const s=editor.selectionStart;
    const val=editor.value;
    const ls=val.lastIndexOf('\n',s-1)+1;
    const le=val.indexOf('\n',s);
    const lineEnd=le===-1?val.length:le;
    const fullLine=val.slice(ls,lineEnd);
    const ulMatch=fullLine.match(/^(\s*[-*+]) /);
    const olMatch=fullLine.match(/^(\s*)(\d+)\.(\s+)/);
    if(ulMatch||olMatch){
      const prefix=ulMatch?ulMatch[0]:olMatch[0];
      const content=fullLine.slice(prefix.length);
      // Only intercept if cursor is within the content area (not inside the prefix)
      if(s<ls+prefix.length) return;
      e.preventDefault();
      if(content.trim()===''){
        // Empty list item — cancel list and leave cursor on a plain line
        editor.value=val.slice(0,ls)+val.slice(lineEnd);
        editor.selectionStart=editor.selectionEnd=ls;
        if(olMatch){
          const rn=renumberOrderedLists(editor.value,editor.selectionStart);
          if(rn){editor.value=rn.val;editor.selectionStart=editor.selectionEnd=rn.cursorPos;}
        }
      } else if(ulMatch){
        // Continue unordered list; move text after cursor to new item.
        // trimStart prevents a double-space when cursor is on whitespace between words.
        const tail=val.slice(s,lineEnd).trimStart();
        const ins='\n'+ulMatch[0]+tail;
        editor.value=val.slice(0,s)+ins+val.slice(lineEnd);
        editor.selectionStart=editor.selectionEnd=s+ins.length-tail.length;
      } else {
        // Continue ordered list; move text after cursor to new item.
        // trimStart prevents a double-space when cursor is on whitespace between words.
        const tail=val.slice(s,lineEnd).trimStart();
        const ins='\n'+olMatch[1]+(parseInt(olMatch[2],10)+1)+'.'+olMatch[3]+tail;
        editor.value=val.slice(0,s)+ins+val.slice(lineEnd);
        editor.selectionStart=editor.selectionEnd=s+ins.length-tail.length;
        const rn=renumberOrderedLists(editor.value,editor.selectionStart);
        if(rn){editor.value=rn.val;editor.selectionStart=editor.selectionEnd=rn.cursorPos;}
      }
      setDirty(true); renderPreview(); updateStats(); scheduleSaveDraft();
    }
  }
});

document.addEventListener('keydown',e=>{
  const c=e.ctrlKey||e.metaKey;
  if(c&&e.key==='s'){e.preventDefault();saveFile();}
  if(c&&e.key==='o'){e.preventDefault();openFile();}
  if(c&&e.key==='n'){e.preventDefault();newFile();}
});

// Swipe left/right to switch views (mobile only)
const MIN_SWIPE_DISTANCE = 60;
const MAX_VERTICAL_RATIO = .75;
let touchStartX = null, touchStartY = null, toolbarTouch = false;
const mainEl=document.getElementById('main');
function resetMainTouchState() {
  touchStartX = null;
  touchStartY = null;
  toolbarTouch = false;
}
mainEl.addEventListener('touchstart',e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  toolbarTouch = e.target.closest('#md-toolbar') !== null;
},{passive:true});
mainEl.addEventListener('touchend',e=>{
  if (toolbarTouch) {
    resetMainTouchState();
    return;
  }
  if(touchStartX===null||touchStartY===null){
    resetMainTouchState();
    return;
  }
  const dx = e.changedTouches[0].clientX - touchStartX, dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx)<MIN_SWIPE_DISTANCE||Math.abs(dy)>Math.abs(dx)*MAX_VERTICAL_RATIO){
    resetMainTouchState();
    return;
  }
  if(window.innerWidth>=768){
    resetMainTouchState();
    return;
  }
  if(dx<0){
    if(currentView==='contents')     setView('editor');
    else if(currentView==='editor')  setView('preview');
  } else {
    if(currentView==='preview')      setView('editor');
    else if(currentView==='editor')  setView('contents');
  }
  resetMainTouchState();
},{passive:true});
mainEl.addEventListener('touchcancel',resetMainTouchState,{passive:true});

// Split-view synchronized scrolling
const previewPane=document.getElementById('preview-pane');
let _scrollSyncing=false, _scrollSyncTimer=null;

function _syncPreviewFromEditor(){
  const totalLines=editor.value.split('\n').length||1;
  const lineHeight=editor.scrollHeight/totalLines;
  const firstVisibleLine=Math.floor(editor.scrollTop/lineHeight);
  const elems=preview.querySelectorAll('[data-source-line]');
  let target=null;
  for(const el of elems){
    if(parseInt(el.dataset.sourceLine,10)<=firstVisibleLine) target=el;
    else break;
  }
  const elRect=(target||preview).getBoundingClientRect();
  const paneRect=previewPane.getBoundingClientRect();
  previewPane.scrollTop+=elRect.top-paneRect.top;
}

function _syncEditorFromPreview(){
  const paneRect=previewPane.getBoundingClientRect();
  const elems=preview.querySelectorAll('[data-source-line]');
  let topEl=null;
  for(const el of elems){
    const r=el.getBoundingClientRect();
    if(r.bottom>paneRect.top){topEl=el;break;}
  }
  if(!topEl) return;
  const sourceLine=parseInt(topEl.dataset.sourceLine,10);
  const totalLines=editor.value.split('\n').length||1;
  const lineHeight=editor.scrollHeight/totalLines;
  editor.scrollTop=sourceLine*lineHeight;
}

// Returns the source line number of the topmost visible element in the preview pane
function _getTopSourceLineFromPreview(){
  const paneRect=previewPane.getBoundingClientRect();
  const elems=preview.querySelectorAll('[data-source-line]');
  for(const el of elems){
    if(el.getBoundingClientRect().bottom>paneRect.top)
      return parseInt(el.dataset.sourceLine,10);
  }
  return null;
}

// Scrolls the target view pane so that `line` appears at the top
function _scrollToSourceLine(targetView,line){
  if(targetView==='preview'){
    const elems=preview.querySelectorAll('[data-source-line]');
    let target=null;
    for(const el of elems){
      if(parseInt(el.dataset.sourceLine,10)<=line) target=el;
      else break;
    }
    if(target){
      const paneRect=previewPane.getBoundingClientRect();
      previewPane.scrollTop+=target.getBoundingClientRect().top-paneRect.top;
    }
  } else if(targetView==='editor'){
    const totalLines=editor.value.split('\n').length||1;
    editor.scrollTop=line*(editor.scrollHeight/totalLines);
  }
}

editor.addEventListener('scroll',()=>{
  if(currentView!=='split'||_scrollSyncing) return;
  _scrollSyncing=true;
  _syncPreviewFromEditor();
  clearTimeout(_scrollSyncTimer);
  _scrollSyncTimer=setTimeout(()=>{_scrollSyncing=false;},50);
},{passive:true});

previewPane.addEventListener('scroll',()=>{
  if(currentView!=='split'||_scrollSyncing) return;
  _scrollSyncing=true;
  _syncEditorFromPreview();
  clearTimeout(_scrollSyncTimer);
  _scrollSyncTimer=setTimeout(()=>{_scrollSyncing=false;},50);
},{passive:true});

document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',async e=>{
  e.preventDefault();
  const f=e.dataTransfer.files[0];
  if(!f||!/\.(md|markdown|txt)$/i.test(f.name)){showToast('Drop a .md file','error');return;}
  confirmDiscard(async()=>{
    editor.value=await f.text();
    setFilename(f.name.replace(/\.[^.]+$/,''));
    fileHandle=null; setDirty(false); renderPreview(); updateStats(); showContent();
    saveDraft(); showToast('File loaded','success');
  });
});

updateStats();
restoreDraft();
setView('editor');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
